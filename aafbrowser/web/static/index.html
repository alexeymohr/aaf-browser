<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aafbrowser</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="view-tracks">
  <header id="topbar">
    <div class="brand">AAF Browser</div>
    <div class="file-info">
      <span id="file-status" class="muted">No file open</span>
      <button id="btn-open" type="button">Open…</button>
      <button id="btn-close" type="button" hidden>Close</button>
      <a id="btn-quit" class="quit-link" href="#" title="Stop the local server and quit">Quit</a>
    </div>
    <div class="find-box">
      <input id="find-pattern" type="text" placeholder="regex pattern"
             autocomplete="off" spellcheck="false">
      <select id="find-scope" title="What to match">
        <option value="both">names + values</option>
        <option value="names">names only</option>
        <option value="values">values only</option>
      </select>
      <select id="find-layer" title="Which layer to search">
        <option value="both">aaf + cfb</option>
        <option value="aaf">aaf</option>
        <option value="cfb">cfb</option>
      </select>
      <details id="find-class-filter" class="class-filter">
        <summary id="find-class-summary" title="Restrict the AAF-layer walk to selected Mob classes">
          all classes
        </summary>
        <div id="find-class-options" class="class-options">
          <p class="muted">Open a file to see classes.</p>
        </div>
      </details>
      <button id="btn-find" type="button">Search</button>
    </div>
  </header>

  <section id="session-bar" hidden>
    <!-- Cells populated by renderSessionBar() — see app.js. Each cell
         is one operator-meaningful headline fact about the open file. -->
  </section>

  <nav id="view-tabs" role="tablist">
    <button class="view-tab active" data-view="tracks" type="button"
            role="tab" aria-selected="true">Tracks</button>
    <button class="view-tab" data-view="sources" type="button"
            role="tab" aria-selected="false">Sources</button>
    <button class="view-tab" data-view="mobs" type="button"
            role="tab" aria-selected="false">All Mobs</button>
    <button class="view-tab" data-view="cfb" type="button"
            role="tab" aria-selected="false">CFB</button>
  </nav>

  <dialog id="open-dialog">
    <form method="dialog" id="open-form">
      <label for="open-path">Path to AAF file</label>
      <input id="open-path" type="text" name="path" autocomplete="off"
             spellcheck="false" placeholder="/abs/path/to/file.aaf">
      <div class="actions">
        <button type="submit" value="cancel">Cancel</button>
        <button type="submit" value="open" id="open-submit">Open</button>
      </div>
      <p class="error" id="open-error" hidden></p>
    </form>
  </dialog>

  <main id="layout">
    <!-- Tracks view: track list (col 1), clips on selected track (col 3),
         shared inspector (col 5). Splitters in cols 2 and 4 are
         drag-resizable. Visible when body.view-tracks. -->
    <aside id="tracks-pane" class="left-pane view-tracks-only">
      <div class="filter-row">
        <span id="tracks-summary" class="muted">No file open.</span>
      </div>
      <div id="track-list" class="scroll-list"></div>
    </aside>
    <div class="splitter view-tracks-only" data-resize="--col-tracks"
         data-min="160" data-max="600"></div>
    <section id="clips-pane" class="view-tracks-only">
      <div class="filter-row">
        <span id="clips-summary" class="muted">Select a track.</span>
      </div>
      <div id="clips-tree" class="scroll-list"></div>
    </section>
    <div class="splitter view-tracks-only" data-resize="--col-clips"
         data-min="240" data-max="900"></div>

    <!-- Sources view: cross-track source-mob pull list (col 1),
         shared inspector (col 3). Splitter in col 2. Visible when
         body.view-sources. -->
    <aside id="sources-pane" class="left-pane view-sources-only">
      <div class="filter-row">
        <input id="source-filter" type="text" placeholder="filter by name…"
               autocomplete="off" spellcheck="false">
      </div>
      <div id="source-list" class="scroll-list"></div>
    </aside>
    <div class="splitter view-sources-only" data-resize="--col-sources"
         data-min="280" data-max="800"></div>

    <!-- All Mobs view: mob list (col 1), shared inspector (col 3).
         Splitter in col 2. Visible when body.view-mobs. -->
    <aside id="mobs-pane" class="left-pane view-mobs-only">
      <div class="filter-row">
        <input id="mob-filter" type="text" placeholder="filter by name…"
               autocomplete="off" spellcheck="false">
      </div>
      <div id="mob-list" class="scroll-list"></div>
    </aside>
    <div class="splitter view-mobs-only" data-resize="--col-mobs"
         data-min="220" data-max="700"></div>

    <!-- CFB view: cfb tree (col 1), shared inspector (col 3).
         Splitter in col 2. Visible when body.view-cfb. -->
    <aside id="cfb-pane" class="left-pane view-cfb-only">
      <div class="filter-row">
        <label class="check">
          <input type="checkbox" id="cfb-include-metadict">
          include MetaDictionary
        </label>
      </div>
      <div id="cfb-tree" class="scroll-list"></div>
    </aside>
    <div class="splitter view-cfb-only" data-resize="--col-cfb"
         data-min="220" data-max="700"></div>

    <!-- Shared inspector. Last grid cell — gets minmax(0, 1fr) so its
         width stays stable as content changes. -->
    <section id="inspector-pane">
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <div id="inspector" class="inspector">
        <p class="muted">Open a file, then select something to inspect it.</p>
      </div>
    </section>
  </main>

  <section id="find-panel" class="find-panel collapsed">
    <header>
      <button id="btn-find-toggle" type="button" class="caret">▶</button>
      <span id="find-summary" class="muted">No search yet.</span>
    </header>
    <div id="find-results" class="find-results"></div>
  </section>

  <template id="tpl-mob-row">
    <div class="mob-row">
      <span class="name"></span>
      <span class="badge mob-id"></span>
    </div>
  </template>

  <template id="tpl-class-section">
    <details class="class-section">
      <summary>
        <span class="class-name"></span>
        <span class="class-count muted"></span>
      </summary>
      <div class="class-rows"></div>
    </details>
  </template>

  <template id="tpl-track-row">
    <div class="track-row">
      <span class="track-ordinal"></span>
      <span class="track-kind-tag"></span>
      <span class="track-name"></span>
      <span class="track-meta muted"></span>
    </div>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
